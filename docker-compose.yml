version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: mi_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sistema_calificacion
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - red_sistema

  backend:
    image: node:20-alpine
    container_name: node_backend
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: sistema_calificacion
      JWT_SECRET: tu_secreto_jwt
    command: sh -c "npm run dev"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red_sistema

  frontend:
    image: node:20-alpine
    container_name: react_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm run dev -- --host"
    depends_on:
      - backend
    networks:
      - red_sistema

networks:
  red_sistema:
    driver: bridge

volumes:
  db_data: